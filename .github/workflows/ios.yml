name: iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          set +e
          xcodebuild -project Soon.xcodeproj -scheme Soon -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          echo "::group::Errors and warnings"
          grep -E "(error|warning):" build.log | grep -v "^ld: warning" | sort -u | head -150
          echo "::endgroup::"
          tail -5 build.log
          exit $status

      - name: Screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rts = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")], reverse=True)
          for want in ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone"):
              for rt in rts:
                  for dev in d[rt]:
                      if dev["name"] == want or (want == "iPhone" and dev["name"].startswith("iPhone")):
                          print(dev["udid"]); sys.exit()
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/Soon.app
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" network.playgrounds.soon >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" network.playgrounds.soon "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-sign-in -signin
          shot 02-home -demo tachi
          shot 03-home-annie -demo annie
          shot 04-weekend -demo tachi -screen weekend
          shot 05-calendar -demo tachi -screen calendar
          shot 06-plans -demo tachi -screen plans
          shot 07-ask -demo tachi -screen ask
          shot 08-settings -demo tachi -screen settings
          shot 09-widgets -demo tachi -gallery home
          shot 10-lock-screen -demo annie -gallery lock
          shot 11-on-the-way -demo annie -gallery road
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Soon"' --style compact 2>/dev/null | grep -iE "error|fault|font" | tail -40 || true

      - name: Publish screenshots to the ci/shots branch
        if: always()
        run: |
          mkdir -p shots
          cp ios/build.log shots/ 2>/dev/null || true
          cd shots
          # Keep Vercel from trying to deploy this branch.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q
          git checkout -q -b ci/shots
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/shots
